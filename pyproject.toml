[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cilada"
version = "0.1.0"
description = "OpenAPI-driven load testing CLI built with Typer and Locust."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "André Argôlo" }]
dependencies = [
  "httpx>=0.27,<1",
  "locust>=2.31,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
cilada = "cilada.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cilada"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
